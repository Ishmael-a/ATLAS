# ci workflow for type checking and building backend on any change coming in to main

name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'atlas-backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'atlas-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install project dependencies
        working-directory: atlas-backend
        run:  npm install
        
      - name: Generate prisma client so type check resolves prisma types cleanly
        working-directory: atlas-backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Type-check project
        working-directory: atlas-backend
        run:  npx tsc --noEmit

      # Goal: Successfully build code
      - name: Build project
        working-directory: atlas-backend
        run:  npm run build

  deploy: # Tell Render to trigger deployment
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment via curl
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"   